# Run the kiosk as defconmon, full-screen under cage.
#
# A drop-in override rather than a rewritten unit, so the base unit keeps its own
# command: delete this file and run
#   systemctl daemon-reload && systemctl restart dashboard.service
# to fall back to it.
#
# TZ: the container's system clock may be UTC. If this is a wall display in a
# local timezone, give the service your timezone here - it only affects
# defconmon (log timestamps stay UTC). Change or remove this line to taste.
#
# Pacing and the screen rotation live in /etc/defconmon/config.json now, not
# here: the display re-reads that file whenever it changes, so tuning it needs no
# restart. Edit it with the config server (defconmon-config.service) or by hand.
# This unit only has to say where the file is.
[Service]
Environment=TZ=Etc/UTC
ExecStart=
ExecStart=/usr/bin/cage -- /usr/local/bin/defconmon --config /etc/defconmon/config.json
