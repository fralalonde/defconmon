[package]
name = "gpu-spike"
version = "0.1.0"
edition = "2021"

# Deliberately NOT added to defconmon yet: this crate exists to answer
# "does wgpu drive this GPU, and is the post-process faster on it?" before the
# real renderer is rewritten around it.
[dependencies]
wgpu = { version = "30", default-features = false, features = ["gles", "wgsl"] }
pollster = "0.4"
libc = "0.2"
