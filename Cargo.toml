[package]
name = "defconmon"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"
serde_json = "1"
# for localtime_r: the dashboard shows a wall clock, so it must respect TZ/DST
libc = "0.2"

# Live display core: pure-Rust Wayland present path, always built. `system`
# gives the C libwayland backend, which is what exposes the raw wl_display
# pointer the GPU path (EGL) needs.
wayland-client = { version = "0.31", default-features = false, features = ["system"] }
wayland-protocols = { version = "0.32", default-features = false, features = ["client"] }
memmap2 = "0.9"

# GPU present path. wgpu loads EGL via dlopen at runtime, so it is a *runtime*
# dependency that may be absent - the CPU path is the fallback. It is behind the
# `gpu` feature so a `--no-default-features` build stays a small, dependency-free
# CPU-only display (~2 MB); the GPU binary is a dynamic glibc build (built in a
# Debian-12 container, not the static-musl form): EGL needs a real wl_display/
# wl_surface, which the pure-Rust Wayland backend does not have.
wgpu = { version = "30", default-features = false, features = ["gles", "wgsl"], optional = true }
pollster = { version = "0.4", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[features]
# Both optional profiles are on by default, so a plain `cargo build` is the full
# display + config server. Drop them with `--no-default-features` for the lean
# CPU-only display.
default = ["gpu", "web"]
# GPU present path: wgpu/EGL does the upscale and the whole CRT finish. Optional:
# disable it for the lean CPU-only present path.
gpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:raw-window-handle",
]
# Config server. Its own binary target (`defconmon-config`) and its own build:
# the display binary stays lean and can be built without it (std-only HTTP, no
# extra dependencies beyond the shared config schema).
web = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"   # so a GPU panic can fall back instead of killing the display
strip = true

# Two binaries sharing one library so their artifacts never overwrite each other:
#   defconmon        -- the live display
#   defconmon-config -- the web config server (needs the `web` feature)
[[bin]]
name = "defconmon"
path = "src/bin/defconmon.rs"
required-features = []   # the display builds from pure preview to full GPU

[[bin]]
name = "defconmon-config"
path = "src/bin/defconmon-config.rs"
# Only ever built for the server; distinct name so a `--features web` build
# cannot clobber the display artifact (which is how the outage happened).
required-features = ["web"]