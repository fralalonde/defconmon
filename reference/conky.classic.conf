-- HOME NETWORK dashboard - classic conky system monitor, plotter fonts.
-- Headings: IBM 3270 (thin single-stroke). Body: Px VGA SquarePx.
-- Numbers/clock: DSEG7 Classic. Colours set explicitly.
-- Left: SYSTEM / CPU-MEM / WAN / CLOCK.  Right: PVE HOST / NET ACCESS / PVE GUESTS.
conky.config = {
    alignment = 'top_left',
    background = false,
    double_buffer = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_colour = '050505',
    own_window_argb_visual = false,

    minimum_width = 1920,
    minimum_height = 1080,
    gap_x = 0,
    gap_y = 0,

    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,

    use_xft = true,
    font = 'Px VGA SquarePx:size=28',
    update_interval = 1.0,

    default_color = '7dff6b',
    color1 = '3cff00',
    color2 = 'ff2445',
    color3 = 'f09000',
    color4 = '2f9e3f',
    color7 = '7dff6b',

    cpu_avg_samples = 2,
    net_avg_samples = 2,
};

conky.text = [[

${voffset 4}

${goto 40}${font IBM 3270:size=34}${color3}SYSTEM${font}${goto 1000}${font IBM 3270:size=34}${color3}PVE  HOST${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}node${color4} ${nodename}${font}${goto 1000}${font Px VGA SquarePx:size=28}${color4}node ${color7}${execi 2 jq -r .pve.node /run/dashboard/dashboard.json}${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}kernel${color7} ${execi 300 uname -r}${font}${goto 1000}${font Px VGA SquarePx:size=28}${color4}load ${color7}${execi 2 jq -r .pve.load1 /run/dashboard/dashboard.json}${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}up${color7} ${uptime}${font}${goto 1000}${font Px VGA SquarePx:size=28}${color4}guests ${color7}${execi 2 jq -r .pve.guests_running /run/dashboard/dashboard.json}${color4}/${color7}${execi 2 jq -r .pve.guests_total /run/dashboard/dashboard.json}${font}

${voffset -50}

${goto 40}${font IBM 3270:size=34}${color3}CPU / MEM${font}${goto 1000}${font IBM 3270:size=34}${color3}NET ACCESS${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}load${color7} ${loadavg 1} ${loadavg 2} ${loadavg 3}${font}${goto 1000}${font Px VGA SquarePx:size=34}${color4}WAN  ${font}${font IBM 3270:size=34}${if_existing /run/dashboard/tl-wan-green}${color1}GREEN${else}${if_existing /run/dashboard/tl-wan-yellow}${color3}YELLOW${else}${color2}RED${endif}${endif}${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}cpu${color7} ${cpu}%${font}${goto 1000}${font Px VGA SquarePx:size=34}${color4}PING ${font}${font IBM 3270:size=34}${if_existing /run/dashboard/tl-ping-green}${color1}GREEN${else}${if_existing /run/dashboard/tl-ping-yellow}${color3}YELLOW${else}${color2}RED${endif}${endif}${font}
${goto 40}${font Px VGA SquarePx:size=28}${color4}mem${color7} ${memperc}%   ${color4}swap${color7} ${swapperc}%${font}${goto 1000}${font Px VGA SquarePx:size=34}${color4}DNS  ${font}${font IBM 3270:size=34}${if_existing /run/dashboard/tl-dns-green}${color1}GREEN${else}${if_existing /run/dashboard/tl-dns-yellow}${color3}YELLOW${else}${color2}RED${endif}${endif}${font}
${goto 40}${font Px VGA SquarePx:size=16}${color4}RAM  ${font}${membar 24,520}${goto 1000}${font Px VGA SquarePx:size=24}${color4}from LAN: gw / 1.1.1.1 / resolver${font}
${goto 40}${font Px VGA SquarePx:size=16}${color4}DISK ${font}${fs_bar 24,520 /}

${voffset -50}

${goto 40}${font IBM 3270:size=34}${color3}WAN  TRAFFIC${font}${goto 1000}${font IBM 3270:size=34}${color3}PVE  GUESTS${font}
${goto 40}${font Px VGA SquarePx:size=30}${color4}rx${font}${font DSEG7 Classic:size=64}${color7}${execi 2 jq -r .wan.rx_mbps /run/dashboard/dashboard.json}${font}${font Px VGA SquarePx:size=28}${color4} Mb/s${font}${goto 1000}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 0}${font}${goto 1340}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 3}${font}${goto 1660}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 6}${font}
${goto 40}${font Px VGA SquarePx:size=30}${color4}tx${font}${font DSEG7 Classic:size=64}${color7}${execi 2 jq -r .wan.tx_mbps /run/dashboard/dashboard.json}${font}${font Px VGA SquarePx:size=28}${color4} Mb/s${font}${goto 1000}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 1}${font}${goto 1340}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 4}${font}${goto 1660}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 7}${font}
${goto 40}${font Px VGA SquarePx:size=24}${color4}link ${execi 2 jq -r .wan.line_rate /run/dashboard/dashboard.json}${font}${goto 1000}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 2}${font}${goto 1340}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 5}${font}${goto 1660}${font Px VGA SquarePx:size=28}${color7}${execi 3 /usr/local/lib/dashboard/guest_line.sh 8}${font}

${voffset -96}

${alignc}${font DSEG7 Classic:size=84}${color7}${time %H:%M}${color7}${font}
${alignc}${font Px VGA SquarePx:size=40}${color4}${time %A  %d %B  %Y}${color4}${font}

]]